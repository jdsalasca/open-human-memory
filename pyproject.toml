[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-human-memory"
version = "0.1.0"
description = "Diagnostic harness for cumulative competence in agent memory"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Juan David Salas Camargo"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
